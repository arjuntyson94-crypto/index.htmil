<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubbles — Your Fun AI Bestie</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff6b9d;
      --orange: #ffa94d;
      --purple: #764ba2;
      --indigo: #667eea;
      --green: #4ade80;
      --bg-chat: rgba(248, 246, 255, 0.88);
      --text-dark: #2d2d4e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #f093fb 50%, #fda085 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Floating background bubbles */
    .bg-bubble {
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
      z-index: 0;
      animation: floatBubble var(--dur) ease-in-out var(--delay) infinite;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      50% { transform: translateY(-24px) rotate(180deg); opacity: 0.9; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-9px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.65) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main chat window */
    .chat-window {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      height: 90vh;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.2);
      animation: fadeSlideIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* Header */
    .header {
      padding: 18px 24px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.22);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 18px rgba(255,107,157,0.55);
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .avatar:hover { transform: scale(1.1) rotate(-5deg); }

    .header-info { flex: 1; }
    .header-name {
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      line-height: 1.1;
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      margin-top: 2px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .header-emoji {
      font-size: 24px;
      margin-left: auto;
      animation: floatBubble 3s ease-in-out infinite;
    }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 8px;
      background: var(--bg-chat);
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,107,157,0.3); border-radius: 10px; }

    .msg-row {
      display: flex;
      margin-bottom: 16px;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot { justify-content: flex-start; }

    .msg-row.new .bubble {
      animation: popIn 0.32s cubic-bezier(0.34,1.56,0.64,1);
    }

    .bot-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 10px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(255,107,157,0.4);
      align-self: flex-end;
    }

    .bubble {
      max-width: 72%;
      padding: 13px 18px;
      font-size: 15px;
      line-height: 1.65;
      font-weight: 500;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bubble.user {
      border-radius: 22px 22px 6px 22px;
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      color: #fff;
      box-shadow: 0 4px 18px rgba(102,126,234,0.38);
    }

    .bubble.bot {
      border-radius: 22px 22px 22px 6px;
      background: rgba(255,255,255,0.95);
      color: var(--text-dark);
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.85);
    }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: flex-end;
      margin-bottom: 16px;
      animation: popIn 0.3s ease;
    }
    .typing-bubble {
      background: rgba(255,255,255,0.95);
      border-radius: 22px 22px 22px 6px;
      padding: 14px 18px;
      display: flex;
      gap: 6px;
      align-items: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.85);
    }
    .typing-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--pink);
    }
    .typing-dot:nth-child(1) { animation: bounce 1.2s ease-in-out 0s infinite; }
    .typing-dot:nth-child(2) { animation: bounce 1.2s ease-in-out 0.2s infinite; }
    .typing-dot:nth-child(3) { animation: bounce 1.2s ease-in-out 0.4s infinite; }

    /* Suggestions */
    .suggestions {
      padding: 12px 20px 4px;
      background: var(--bg-chat);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .suggestion-btn {
      padding: 8px 15px;
      border-radius: 20px;
      border: 2px solid var(--indigo);
      background: rgba(102,126,234,0.08);
      color: var(--indigo);
      font-size: 13px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .suggestion-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }

    /* Input area */
    .input-area {
      padding: 14px 18px;
      background: rgba(248,246,255,0.94);
      border-top: 1px solid rgba(200,190,240,0.3);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      padding: 13px 18px;
      border-radius: 22px;
      border: 2px solid rgba(200,190,240,0.5);
      background: rgba(255,255,255,0.92);
      font-size: 15px;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: var(--text-dark);
      resize: none;
      transition: all 0.2s ease;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      outline: none;
    }
    #chat-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,107,157,0.18);
    }
    #chat-input::placeholder { color: rgba(102,80,140,0.45); }

    #send-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 4px 18px rgba(255,107,157,0.45);
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) {
      transform: scale(1.1) rotate(-6deg);
      box-shadow: 0 8px 26px rgba(255,107,157,0.6);
    }
    #send-btn:active:not(:disabled) { transform: scale(0.93); }
    #send-btn:disabled {
      background: rgba(200,190,240,0.4);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Mobile */
    @media (max-width: 680px) {
      .chat-window {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      body { padding: 0; align-items: stretch; }
    }
  </style>
</head>
<body>

  <!-- Background floating bubbles -->
  <div class="bg-bubble" style="left:8%;top:12%;width:30px;height:30px;--dur:4s;--delay:0s;"></div>
  <div class="bg-bubble" style="left:80%;top:8%;width:50px;height:50px;--dur:5s;--delay:0.8s;"></div>
  <div class="bg-bubble" style="left:50%;top:20%;width:18px;height:18px;--dur:3.5s;--delay:0.3s;"></div>
  <div class="bg-bubble" style="left:20%;top:70%;width:40px;height:40px;--dur:6s;--delay:1.2s;"></div>
  <div class="bg-bubble" style="left:88%;top:60%;width:24px;height:24px;--dur:4.5s;--delay:0.6s;"></div>
  <div class="bg-bubble" style="left:65%;top:85%;width:35px;height:35px;--dur:5.5s;--delay:1.8s;"></div>

  <div class="chat-window">

    <!-- Header -->
    <div class="header">
      <div class="avatar" title="Bubbles">🫧</div>
      <div class="header-info">
        <div class="header-name">Bubbles</div>
        <div class="header-status">
          <div class="status-dot"></div>
          Online &amp; ready to chat!
        </div>
      </div>
      <div class="header-emoji">🎉</div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages"></div>

    <!-- Suggestions -->
    <div class="suggestions" id="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Tell me a joke 😂</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Fun fact! 🤓</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Brainstorm with me 💡</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Say something cool ✨</button>
    </div>

    <!-- Input -->
    <div class="input-area">
      <textarea
        id="chat-input"
        placeholder="Say something fun... ✨"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">🚀</button>
    </div>

  </div>

  <script>
    const SYSTEM_PROMPT = `You are Bubbles, a super fun, energetic, and playful AI assistant! 🎉

Your personality:
- You're enthusiastic and upbeat — you LOVE helping people!
- You use fun emojis naturally (but not excessively)
- You're witty and like to make little jokes or puns when appropriate
- You're warm, encouraging, and make people feel good
- You give helpful, accurate answers but with a light and breezy tone
- Occasionally use fun expressions like "Ooh!", "Oh snap!", "Let's gooo!", "How cool is that?!"
- Keep responses concise but delightful

You're here to chat, answer questions, help brainstorm, tell jokes, or just hang out. Make every interaction feel like talking to a best friend who happens to know a lot of stuff!`;

    const history = [];
    let loading = false;
    let suggestionsDismissed = false;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const suggestionsEl = document.getElementById('suggestions');

    // Welcome message on load
    addMessage('bot', "Heyyy! 👋 I'm Bubbles, your fun AI bestie! What's on your mind today? Let's make it awesome! 🌟");

    function addMessage(role, text, animate = true) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}${animate ? ' new' : ''}`;

      if (role === 'bot') {
        const av = document.createElement('div');
        av.className = 'bot-avatar';
        av.textContent = '🫧';
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      row.appendChild(bubble);

      messagesEl.appendChild(row);
      scrollToBottom();

      if (animate) {
        setTimeout(() => row.classList.remove('new'), 400);
      }
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing';

      const av = document.createElement('div');
      av.className = 'bot-avatar';
      av.textContent = '🫧';
      row.appendChild(av);

      const bubble = document.createElement('div');
      bubble.className = 'typing-bubble';
      bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      row.appendChild(bubble);

      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(val) {
      loading = val;
      sendBtn.disabled = val;
      sendBtn.textContent = val ? '⏳' : '🚀';
      inputEl.disabled = val;
    }

    function hideSuggestions() {
      if (!suggestionsDismissed) {
        suggestionsDismissed = true;
        suggestionsEl.style.display = 'none';
      }
    }

    async function sendMessage(text) {
      const msg = (text || inputEl.value).trim();
      if (!msg || loading) return;

      hideSuggestions();
      inputEl.value = '';
      inputEl.style.height = '';
      inputEl.rows = 1;

      addMessage('user', msg);
      history.push({ role: 'user', content: msg });

      setLoading(true);
      showTyping();

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            system: SYSTEM_PROMPT,
            messages: history,
          }),
        });

        const data = await res.json();
        const reply = (data.content || []).map(b => b.text || '').join('') || "Oops, my brain glitched! 😵 Try again?";

        hideTyping();
        addMessage('bot', reply);
        history.push({ role: 'assistant', content: reply });

      } catch (e) {
        hideTyping();
        addMessage('bot', "Uh oh, something went wrong! 😅 Give it another shot!");
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    function sendSuggestion(btn) {
      sendMessage(btn.textContent);
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
  </script>
</body>
</html>
